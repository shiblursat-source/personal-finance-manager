name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Regenerate missing Android scaffolding
        # This project was hand-written and has no Gradle wrapper / full
        # Flutter template. `flutter create` in an existing project only
        # regenerates missing platform files; it does not overwrite
        # existing lib/ code or pubspec.yaml.
        run: flutter create --platforms=android --project-name personal_finance_manager --org com.shiblur .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (non-fatal)
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-finance-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
