name: personal_finance_manager
description: "Personal Finance & Expense Manager for Bangladesh — offline ledger, loans/EMI, salary & PF, Eid/tour budgets, projects, Drive backup. Built for Shiblur Rahman."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  fl_chart: ^0.69.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.2
  excel: ^4.0.6
  share_plus: ^10.0.2
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  encrypt: ^5.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
flutter:
  uses-material-design: true
